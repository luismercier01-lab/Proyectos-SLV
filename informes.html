<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Informes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2310284a%27/%3E%3Cg fill=%27none%27 stroke=%27%23c9a24d%27 stroke-width=%272%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M6 12q10-5 20 0%27/%3E%3Cpath d=%27M6 18q10-5 20 0%27/%3E%3Cpath d=%27M6 24q10-5 20 0%27/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">Biblioteca</div>
    <h1>Informes y prescripciones</h1>
    <p>Todo lo que elaboramos: ambientaciones, prescripciones, evaluaciones de campos y análisis a medida.</p>
  </div>
  <div class="filters">
    <label>Tipo <select id="f-tipo"><option value="">Todos</option></select></label>
    <label>Estado <select id="f-estado"><option value="">Todos</option></select></label>
    <label>Año <select id="f-anio"><option value="">Todos</option></select></label>
    <label>Campo <select id="f-campo"><option value="">Todos</option></select></label>
    <label>Buscar <input id="f-q" type="search" placeholder="Título, cliente o etiqueta"></label>
    <button class="btn-reset" id="f-reset" type="button">Limpiar</button>
    <span class="spacer"></span>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="rep-list" id="list" style="border-top:none;margin-bottom:84px"></div>
</main>
<footer id="site-footer"></footer>
<script src="js/common.js"></script>
<script src="js/informes.js"></script>
</body>
</html>
