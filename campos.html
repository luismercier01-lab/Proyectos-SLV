<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Campos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2310284a%27/%3E%3Cg fill=%27none%27 stroke=%27%23c9a24d%27 stroke-width=%272%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M6 12q10-5 20 0%27/%3E%3Cpath d=%27M6 18q10-5 20 0%27/%3E%3Cpath d=%27M6 24q10-5 20 0%27/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head" style="padding-bottom:20px">
      <div class="eyebrow">Cartera</div>
      <h1>Campos</h1>
      <p>Campos en venta y campos sobre los que trabajamos. Cada ficha reúne sus datos, su mapa y sus informes.</p>
    </div>
  </div>

  <div class="explorer-bar">
    <div class="wrap">
      <div class="filters">
        <label>Estado <select id="f-estado"><option value="">Todos</option></select></label>
        <label>Provincia <select id="f-prov"><option value="">Todas</option></select></label>
        <label>Uso <select id="f-uso"><option value="">Todos</option></select></label>
        <label>Superficie
          <select id="f-ha">
            <option value="">Cualquiera</option>
            <option value="0-100">Hasta 100 ha</option>
            <option value="100-300">100 a 300 ha</option>
            <option value="300-1000">300 a 1.000 ha</option>
            <option value="1000-999999">Más de 1.000 ha</option>
          </select>
        </label>
        <label>Buscar <input id="f-q" type="search" placeholder="Nombre o localidad"></label>
        <button class="btn-reset" id="f-reset" type="button">Limpiar</button>
        <span class="spacer"></span>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <div class="explorer">
    <div class="list-panel" id="list"></div>
    <div class="map-wrap" id="map-wrap"><div id="map"></div></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="js/common.js"></script>
<script src="js/campos.js"></script>
</body>
</html>
